# Denta Kids on one VPS: Postgres + the app + Caddy (HTTPS).
# Run from the project folder:
#   docker compose -f deploy/docker-compose.yml --env-file .env.production up -d --build

name: dentakids

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: dentalweb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dentalweb"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID:-}
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgres://dental:${POSTGRES_PASSWORD}@db:5432/dentalweb
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  # schema changes — run once per deploy: docker compose … run --rm migrate
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: build
      args:
        NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID:-}
    environment:
      DATABASE_URL: postgres://dental:${POSTGRES_PASSWORD}@db:5432/dentalweb
    command: ["pnpm", "db:push"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # a real domain gets a free HTTPS certificate automatically; ":80" = plain HTTP by IP
      SITE_ADDRESS: ${DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
